<div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
  <div class="p-8">
    <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
  </div>

  <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden mx-8">
    <!-- Header -->
    <div class="bg-slate-50 p-4 border-b border-slate-200">
      <h2 class="text-xl font-semibold text-slate-900">Historial Clínico</h2>
      <p class="text-sm text-slate-600 mt-1">Registrar información médica del paciente</p>
    </div>

    <!-- Formulario -->
    <form (ngSubmit)="onSubmit()" class="p-4">
      <!-- Información General -->
      <div class="space-y-3">
        <h3 class="text-lg font-medium text-slate-900 border-b border-slate-200 pb-2">Información General</h3>

        <!-- Primera fila: Fecha y Próxima Cita -->
        <div class="grid grid-cols-2 gap-3">
          <input type="date" [(ngModel)]="historial().date" name="date"
            class="px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
          <input type="date" [(ngModel)]="historial().nextAppointment" name="nextAppointment"
            class="px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Próxima cita">
        </div>

        <!-- Segunda fila: Diagnóstico -->
        <textarea [(ngModel)]="historial().diagnosis" name="diagnosis" rows="3"
          class="w-full px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Diagnóstico"></textarea>

        <!-- Tercera fila: Tratamiento -->
        <textarea [(ngModel)]="historial().treatment" name="treatment" rows="3"
          class="w-full px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Tratamiento realizado"></textarea>

        <!-- Cuarta fila: Medicamentos y Alergias -->
        <div class="grid grid-cols-2 gap-3">
          <textarea [(ngModel)]="historial().medications" name="medications" rows="2"
            class="px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Medicamentos"></textarea>
          <textarea [(ngModel)]="historial().allergies" name="allergies" rows="2"
            class="px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Alergias"></textarea>
        </div>

        <!-- Quinta fila: Observaciones -->
        <textarea [(ngModel)]="historial().observations" name="observations" rows="3"
          class="w-full px-2 py-2 border border-slate-300 rounded text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Observaciones adicionales"></textarea>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-2 mt-6 pt-4 border-t border-slate-200">
        <button type="button" (click)="cancel()"
          class="px-3 py-2 border border-slate-300 text-slate-700 rounded hover:bg-slate-50 transition-colors text-sm">
          Cancelar
        </button>
        <button type="submit"
          class="px-3 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors text-sm">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
