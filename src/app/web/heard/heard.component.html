<nav class="flex flex-wrap items-center justify-between p-6 bg-[#182831]">
  <img src="assets/olimpush.png" alt="Logo" class="h-10 mr-4" />

  <!-- Botón para abrir/cerrar el menú -->
  <button class="lg:hidden block text-gray-500 hover:text-gray-900 focus:text-gray-900 focus:outline-none"
    (click)="toggleMenu()">
    <svg class="h-6 w-6 fill-current" viewBox="0 0 24 24">
      <path
        d="M4 5h16a1 1 0 0 1 0 2H4a1 1 0 1 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2zm0 6h16a1 1 0 0 1 0 2H4a1 1 0 0 1 0-2z" />
    </svg>
  </button>

  <!-- Menú desplegable -->
  <div [ngClass]="{ hidden: !menuOpen, block: menuOpen }" class="w-full lg:flex lg:items-center lg:w-auto mt-4 lg:mt-0">

    <!-- Contenedor de botones en columnas para la versión móvil -->
    <div class="mt-8 lg:mt-0 w-full grid gap-4 lg:flex lg:space-x-2 lg:w-auto items-center">
      <button (click)="goToLogin()"
        class="inline-block px-4 py-2 text-white border border-white rounded-md hover:border-cyan-600  w-full sm:w-auto text-center">
        Iniciar sesión
      </button>

      <!-- Botón de Comenzar Gratis -->
      <button routerLink="/registro_empresa"
        class="inline-block px-4 py-2 text-white bg-cyan-600 rounded-md hover:bg-cyan-500 w-full sm:w-auto text-center">
        Crear tu cuenta
      </button>
    </div>
  </div>
</nav>
